services:
  backend:
    build: ./backend
    container_name: gallery-backend
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      DATABASE_URL: sqlite:////app/data/gallery.db
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    volumes:
      - gallery-data:/app/data
      - gallery-uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the bundle at build time — this is the URL the *browser* uses.
        VITE_API_URL: http://localhost:8000
    container_name: gallery-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  gallery-data:
  gallery-uploads:
